document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r-spacing: -0.02em; text-transform: uppercase; color: #0f172a;\">ICAP<\u002Fspan>\n        <span style=\"font-size: 10px; font-weight: 400; letter-spacing: 0.05em; text-transform: uppercase; color: #64748b;\">Image-Communication Accessibility Protocol<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin: 0; font-size: 24px; font-weight: 300; letter-spacing: 0.01ex; text-transform: uppercase; color: #0f172a;\">Lenguaje visual · hoja de especímenes<\u002Fh1>\n      <p style=\"margin: 0; max-width: 62ch; font-size: 13px; line-height: 1.6; color: #475569; text-wrap: pretty;\">Cada espécimen de esta hoja es la forma canónica de un componente de ICAP v2. El nombre en monoespaciado bajo el título es el nombre del componente y su <code style=\"font-family: 'Fira Code', monospace; font-size: 11px;\">id<\u002Fcode> semántico. Lo que se ve aquí es ley; lo que no está aquí, no existe todavía.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex-shrink: 0; text-align: right; display: flex; flex-direction: column; gap: 4px; font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b; line-height: 1.7;\">\n      <span>rama · v2<\u002Fspan>\n      <span>base · PICTOS.net DS<\u002Fspan>\n      <span>locale · es-419<\u002Fspan>\n      <span>destino · mediafranca/ICAP<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav id=\"vl-toc\" style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 2px 24px; padding: 20px 0 0; border-bottom: 1px solid #e2e8f0; margin-bottom: 56px;\">\n    <a href=\"#s1\" style=\"font-size: 12px; color: #475569; padding: 5px 0;\">01 · Fundamentos heredados<\u002Fa>\n    <a href=\"#s2\" style=\"font-size: 12px; color: #475569; padding: 5px 0;\">02 · Las cuatro capas<\u002Fa>\n    <a href=\"#s3\" style=\"font-size: 12px; color: #475569; padding: 5px 0;\">03 · Veredicto y causa<\u002Fa>\n    <a href=\"#s4\" style=\"font-size: 12px; color: #475569; padding: 5px 0;\">04 · Capa A · barras a umbral<\u002Fa>\n    <a href=\"#s5\" style=\"font-size: 12px; color: #475569; padding: 5px 0;\">05 · Capa B · ajuste doble<\u002Fa>\n    <a href=\"#s6\" style=\"font-size: 12px; color: #475569; padding: 5px 0;\">06 · Capa C · ausencias<\u002Fa>\n    <a href=\"#s7\" style=\"font-size: 12px; color: #475569; padding: 5px 0;\">07 · Revelación diferida<\u002Fa>\n    <a href=\"#s8\" style=\"font-size: 12px; color: #475569; padding: 5px 0;\">08 · Familia · el plano<\u002Fa>\n    <a href=\"#s9\" style=\"font-size: 12px; color: #475569; padding: 5px 0;\">09 · Estados del dato<\u002Fa>\n    <a href=\"#s10\" style=\"font-size: 12px; color: #475569; padding: 5px 0;\">10 · Armazón y pie<\u002Fa>\n    <a href=\"#s11\" style=\"font-size: 12px; color: #475569; padding: 5px 0;\">11 · Prohibiciones<\u002Fa>\n  <\u002Fnav>\n\n  <!-- ══════════ 01 FUNDAMENTOS ══════════ -->\n  <section id=\"s1\" style=\"margin-bottom: 88px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n      <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #94a3b8;\">01<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a;\">Fundamentos heredados de PICTOS.net<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 28px; max-width: 78ch; font-size: 13px; line-height: 1.65; color: #475569; text-wrap: pretty;\">ICAP no inventa un lenguaje: hereda el de PICTOS.net sin modificarlo. Violeta único sobre campo pizarra, esquinas rectas, borde de 1px en lugar de sombra, Lexend para lo humano y Fira Code para los hechos del sistema. La regla de fondo es la misma y aquí importa más que allá: el pictograma evaluado debe ser lo más colorido de la pantalla.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px;\">\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; padding: 24px;\">\n        <div style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 16px;\">Marca y acción<\u002Fdiv>\n        <div style=\"display: flex; gap: 2px; margin-bottom: 16px;\">\n          <div style=\"flex: 1; height: 64px; background: #40069e;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 64px; background: #000000;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 64px; background: #7c3aed;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 64px; background: #ede9fe;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; font-family: 'Fira Code', monospace; font-size: 9px; color: #64748b; line-height: 1.5;\">\n          <span>#40069e<br>primary<\u002Fspan>\n          <span>#000000<br>hover<\u002Fspan>\n          <span>#7c3aed<br>light<\u002Fspan>\n          <span>#ede9fe<br>pale<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; padding: 24px;\">\n        <div style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 16px;\">Campo neutral · slate<\u002Fdiv>\n        <div style=\"display: flex; gap: 2px; margin-bottom: 16px;\">\n          <div style=\"flex: 1; height: 64px; background: #f8fafc; border: 1px solid #e2e8f0;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 64px; background: #f1f5f9;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 64px; background: #e2e8f0;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 64px; background: #cbd5e1;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 64px; background: #94a3b8;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 64px; background: #64748b;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 64px; background: #0f172a;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #64748b;\">50 · 100 · 200 · 300 · 400 · 500 · 900<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px;\">\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; padding: 24px;\">\n        <div style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 18px;\">Roles tipográficos<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: baseline;\">\n            <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">t-brand<\u002Fspan>\n            <span style=\"font-weight: 800; font-size: 20px; letter-spacing: -0.02em; text-transform: uppercase;\">ICAP<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: baseline;\">\n            <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">t-frase<\u002Fspan>\n            <span style=\"font-size: 17px; font-weight: 300; letter-spacing: 0.01ex; text-transform: none;\">Quiero agua, por favor<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: baseline;\">\n            <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">t-label<\u002Fspan>\n            <span style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">capa geométrica<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: baseline;\">\n            <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">t-body<\u002Fspan>\n            <span style=\"font-size: 14px; color: #475569; line-height: 1.6;\">Mueva el control hasta donde ya no pueda nombrar qué muestra el pictograma.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: baseline;\">\n            <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">t-mono<\u002Fspan>\n            <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #64748b;\">item_id = AR_0413 · v3 · sha 8f2ad1c<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; padding: 24px;\">\n        <div style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 18px;\">Superficie del pictograma<\u002Fdiv>\n        <div style=\"background: #e5e5e5; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; border: 1px solid #cbd5e1; height: 168px; display: flex; align-items: center; justify-content: center;\">\n          <div style=\"width: 108px; height: 108px; background: #ffffff; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">pictograma<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 14px 0 0; font-size: 12px; line-height: 1.55; color: #475569;\">La grilla punteada de 20&nbsp;px es la única textura del sistema y en ICAP tiene función, no adorno: da campo medible al signo que se está midiendo. Todo pictograma presentado lleva texto alternativo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 02 CAPAS ══════════ -->\n  <section id=\"s2\" style=\"margin-bottom: 88px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n      <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #94a3b8;\">02<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a;\">Las cuatro capas<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 12px; max-width: 78ch; font-size: 13px; line-height: 1.65; color: #475569; text-wrap: pretty;\">Los cinco matices de fase de PICTOS.net se reasignan a las cuatro capas de ICAP según el origen del dato, que es el principio organizador del instrumento. El matiz identifica la capa; nunca codifica calidad, magnitud ni aprobación.<\u002Fp>\n    <sc-if value=\"{{ showRationale }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"margin: 0 0 28px; max-width: 78ch; font-size: 12px; line-height: 1.6; color: #64748b; border-left: none; padding: 10px 14px; background: #f1f5f9; text-wrap: pretty;\"><strong style=\"font-weight: 500; color: #334155;\">Por qué reasignar y no inventar:<\u002Fstrong> las capas son etapas de un procedimiento, igual que las fases del pipeline generativo, y el sistema ya tiene un juego de matices probado para diagramar procedimientos. Un quinto matiz nuevo habría competido con el violeta de marca.<\u002Fp>\n    <\u002Fsc-if>\n\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;\">\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; border-top: 3px solid #3b82f6; padding: 20px;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;\">\n          <span style=\"font-size: 24px; font-weight: 700; color: #3b82f6; letter-spacing: -0.02em;\">A<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">#3b82f6<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 13px; font-weight: 500; color: #0f172a; margin-bottom: 6px;\">Geométrica<\u002Fdiv>\n        <div style=\"font-size: 12px; color: #475569; line-height: 1.55; margin-bottom: 14px;\">A1 grosor · A2 unidades desligadas · A3 regiones cerradas · A4 contorno inferido<\u002Fdiv>\n        <div style=\"display: inline-block; padding: 2px 8px; background: #dbeafe; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #1e40af;\">script · 0 costo humano<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; border-top: 3px solid #f97316; padding: 20px;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;\">\n          <span style=\"font-size: 24px; font-weight: 700; color: #f97316; letter-spacing: -0.02em;\">B<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">#f97316<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 13px; font-weight: 500; color: #0f172a; margin-bottom: 6px;\">Psicofísica<\u002Fdiv>\n        <div style=\"font-size: 12px; color: #475569; line-height: 1.55; margin-bottom: 14px;\">B1 desenfoque · B2 tamaño · B3 desplazamiento<\u002Fdiv>\n        <div style=\"display: inline-block; padding: 2px 8px; background: #ffedd5; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #9a3412;\">ajuste · submuestra 20%<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; border-top: 3px solid #10b981; padding: 20px;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;\">\n          <span style=\"font-size: 24px; font-weight: 700; color: #10b981; letter-spacing: -0.02em;\">C<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">#10b981<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 13px; font-weight: 500; color: #0f172a; margin-bottom: 6px;\">Interpretativa<\u002Fdiv>\n        <div style=\"font-size: 12px; color: #475569; line-height: 1.55; margin-bottom: 14px;\">C1 transparencia · C2 pragmática · C3 cultural · C4 aprendibilidad<\u002Fdiv>\n        <div style=\"display: inline-block; padding: 2px 8px; background: #d1fae5; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #047857;\">juicio · likert 1–5<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; border-top: 3px solid #8b5cf6; padding: 20px;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;\">\n          <span style=\"font-size: 24px; font-weight: 700; color: #8b5cf6; letter-spacing: -0.02em;\">D<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">#8b5cf6<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 13px; font-weight: 500; color: #0f172a; margin-bottom: 6px;\">Familia<\u002Fdiv>\n        <div style=\"font-size: 12px; color: #475569; line-height: 1.55; margin-bottom: 14px;\">D1 confusabilidad · D2 consistencia · D3 fragilidad<\u002Fdiv>\n        <div style=\"display: inline-block; padding: 2px 8px; background: #ede9fe; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #5b21b6;\">script · set completo<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 16px; padding: 14px 18px; background: #ffffff; border: 1px solid #e2e8f0;\">\n      <span style=\"font-size: 12px; color: #475569; line-height: 1.6;\"><strong style=\"font-weight: 500; color: #0f172a;\">Regla dura:<\u002Fstrong> ningún gráfico combina ejes de capas distintas. La consecuencia de forma es la ficha de tres bandas, y la razón por la que el hexágono de v1 no vuelve.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 03 VEREDICTO ══════════ -->\n  <section id=\"s3\" style=\"margin-bottom: 88px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n      <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #94a3b8;\">03<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a;\">Veredicto con causa nombrada<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 28px; max-width: 78ch; font-size: 13px; line-height: 1.65; color: #475569; text-wrap: pretty;\">Nunca un semáforo agregado. La forma es siempre estado, más causa, más valor en la unidad en que se midió. El perfil compensatorio va al lado con tratamiento gráfico distinto, para que no se lea como una lista de fallas.<\u002Fp>\n\n    <div style=\"background: #ffffff; border: 1px solid #e2e8f0; padding: 0;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9;\">\n        <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Banda de veredicto<\u002Fspan>\n        <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;VerdictBand&gt; · #verdict-band-{itemId}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"padding: 24px; display: flex; flex-direction: column; gap: 24px;\">\n        <sc-if value=\"{{ isBlocked }}\" hint-placeholder-val=\"{{ true }}\">\n          <div id=\"spec-verdict-blocked\" style=\"display: flex; flex-direction: column; gap: 0;\">\n            <div style=\"display: flex; align-items: center; gap: 14px; background: #fee2e2; border: 1px solid #fecaca; padding: 14px 18px;\">\n              <span style=\"width: 8px; height: 8px; background: #dc2626; flex-shrink: 0;\"><\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #991b1b;\">bloqueado<\u002Fspan>\n              <span style=\"font-size: 13px; color: #7f1d1d;\">1 de 3 vetos falló<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border: 1px solid #fecaca; border-top: none;\">\n              <div style=\"display: grid; grid-template-columns: 28px 1fr auto auto; gap: 16px; align-items: center; padding: 14px 18px; border-bottom: 1px solid #fee2e2;\">\n                <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 500; color: #dc2626;\">A1<\u002Fspan>\n                <span style=\"font-size: 13px; color: #0f172a;\">Grosor de trazo bajo el mínimo<\u002Fspan>\n                <span style=\"font-family: 'Fira Code', monospace; font-size: 12px; color: #991b1b;\">1.4 % &lt; 2.0 %<\u002Fspan>\n                <span style=\"font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #dc2626;\">veto<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: 28px 1fr auto auto; gap: 16px; align-items: center; padding: 14px 18px; border-bottom: 1px solid #fee2e2;\">\n                <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 500; color: #94a3b8;\">B2<\u002Fspan>\n                <span style=\"font-size: 13px; color: #475569;\">Tamaño de legibilidad bajo el tamaño de presentación<\u002Fspan>\n                <span style=\"font-family: 'Fira Code', monospace; font-size: 12px; color: #475569;\">96 px &lt; 128 px<\u002Fspan>\n                <span style=\"font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">pasa<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: 28px 1fr auto auto; gap: 16px; align-items: center; padding: 14px 18px;\">\n                <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 500; color: #94a3b8;\">D1<\u002Fspan>\n                <span style=\"font-size: 13px; color: #475569;\">Confusabilidad con vecino del mismo tablero<\u002Fspan>\n                <span style=\"font-family: 'Fira Code', monospace; font-size: 12px; color: #475569;\">0.61 &lt; 0.78<\u002Fspan>\n                <span style=\"font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">pasa<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isAdmissible }}\" hint-placeholder-val=\"{{ false }}\">\n          <div id=\"spec-verdict-admissible\" style=\"display: flex; align-items: center; gap: 14px; background: #ffffff; border: 1px solid #e2e8f0; padding: 14px 18px;\">\n            <span style=\"width: 8px; height: 8px; background: #10b981; flex-shrink: 0;\"><\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #047857;\">admisible<\u002Fspan>\n            <span style=\"font-size: 13px; color: #475569;\">los tres vetos pasan · el perfil se reporta abajo<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div>\n          <div style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 4px;\">Perfil compensatorio<\u002Fdiv>\n          <p style=\"margin: 0 0 14px; font-size: 12px; color: #64748b; line-height: 1.55;\">Se reporta, no elimina. Sin rojo, sin iconos de alarma, sin la palabra «falla».<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #f1f5f9; border: 1px solid #e2e8f0;\">\n            <div style=\"background: #ffffff; padding: 14px 16px;\">\n              <div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #94a3b8; margin-bottom: 6px;\">A2 · unidades desligadas<\u002Fdiv>\n              <div style=\"font-size: 18px; font-weight: 300; color: #0f172a;\">7 <span style=\"font-size: 11px; color: #64748b;\">/ máx 5<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #ffffff; padding: 14px 16px;\">\n              <div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #94a3b8; margin-bottom: 6px;\">D2 · consistencia<\u002Fdiv>\n              <div style=\"font-size: 18px; font-weight: 300; color: #0f172a;\">18<span style=\"font-size: 11px; color: #64748b;\"> % CV / máx 15 %<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #ffffff; padding: 14px 16px;\">\n              <div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #94a3b8; margin-bottom: 6px;\">C · piso de capa<\u002Fdiv>\n              <div style=\"font-size: 18px; font-weight: 300; color: #0f172a;\">3.5 <span style=\"font-size: 11px; color: #64748b;\">/ piso 3.0<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 04 CAPA A ══════════ -->\n  <section id=\"s4\" style=\"margin-bottom: 88px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n      <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #94a3b8;\">04<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a;\">Capa A · barra contra umbral<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 28px; max-width: 78ch; font-size: 13px; line-height: 1.65; color: #475569; text-wrap: pretty;\">En la capa A lo que importa no es el valor sino la distancia al criterio. La barra se lee contra una marca de umbral en negro; el relleno es del matiz de la capa. Las métricas etiquetadas como hipótesis o advertencia se separan tipográficamente y llevan su etiqueta visible.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px;\">\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9;\">\n          <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Métrica verificada<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;ThresholdBar&gt;<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; display: flex; flex-direction: column; gap: 22px;\">\n          <div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px;\">\n              <span style=\"font-size: 12px; color: #0f172a;\"><span style=\"font-family: 'Fira Code', monospace; color: #3b82f6;\">A1<\u002Fspan> grosor de trazo<\u002Fspan>\n              <span style=\"font-family: 'Fira Code', monospace; font-size: 12px; color: #991b1b;\">1.4 %<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position: relative; height: 10px; background: #f1f5f9;\">\n              <div style=\"position: absolute; inset: 0 auto 0 0; width: 28%; background: #dc2626;\"><\u002Fdiv>\n              <div style=\"position: absolute; top: -3px; bottom: -3px; left: 40%; width: 1px; background: #0f172a;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; margin-top: 6px; font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">\n              <span>0 %<\u002Fspan><span style=\"color: #0f172a;\">umbral 2.0 %<\u002Fspan><span>5 %<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px;\">\n              <span style=\"font-size: 12px; color: #0f172a;\"><span style=\"font-family: 'Fira Code', monospace; color: #3b82f6;\">A2<\u002Fspan> unidades desligadas<\u002Fspan>\n              <span style=\"font-family: 'Fira Code', monospace; font-size: 12px; color: #334155;\">7<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position: relative; height: 10px; background: #f1f5f9;\">\n              <div style=\"position: absolute; inset: 0 auto 0 0; width: 70%; background: #3b82f6;\"><\u002Fdiv>\n              <div style=\"position: absolute; top: -3px; bottom: -3px; left: 50%; width: 1px; background: #0f172a;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; margin-top: 6px; font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">\n              <span>0<\u002Fspan><span style=\"color: #0f172a;\">máx 5<\u002Fspan><span>10<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9;\">\n          <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Nivel de evidencia menor<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;ThresholdBar tier=\"…\"&gt;<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; display: flex; flex-direction: column; gap: 22px;\">\n          <div style=\"background: #fefce8; border: 1px solid #fde68a; padding: 16px;\">\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 10px;\">\n              <span style=\"display: inline-block; padding: 2px 8px; background: #fef9c3; border: 1px solid #fde68a; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #a16207;\">advertencia<\u002Fspan>\n              <span style=\"font-size: 11px; color: #a16207;\">fuera de todo veredicto<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px;\">\n              <span style=\"font-size: 12px; font-style: italic; color: #713f12;\"><span style=\"font-family: 'Fira Code', monospace; font-style: normal;\">A3<\u002Fspan> regiones cerra
