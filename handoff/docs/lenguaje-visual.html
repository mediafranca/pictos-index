amily: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;ThresholdField&gt; · #field-threshold-a1<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap;\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <label for=\"spec-th-a1\" style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">A1 · mínimo<\u002Flabel>\n          <input id=\"spec-th-a1\" type=\"text\" value=\"2.0 %\" style=\"width: 120px; padding: 10px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; font-family: 'Fira Code', monospace; font-size: 12px; color: #0f172a;\">\n        <\u002Fdiv>\n        <div style=\"flex: 1; min-width: 320px; background: #fefce8; border: 1px solid #fde68a; padding: 12px 14px;\">\n          <div style=\"font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #a16207; margin-bottom: 6px;\">propuesta sin calibrar<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 12px; line-height: 1.55; color: #713f12; text-wrap: pretty;\">Valor heredado de las anclas verbales de la rúbrica v1 y de literatura de población general. No proviene de calibración sobre datos de comportamiento. Este aviso vive en el punto de edición, nunca sólo en la documentación.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 05 CAPA B ══════════ -->\n  <section id=\"s5\" style=\"margin-bottom: 88px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n      <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #94a3b8;\">05<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a;\">Capa B · método de ajuste con doble pasada<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 28px; max-width: 78ch; font-size: 13px; line-height: 1.65; color: #475569; text-wrap: pretty;\">La interacción más novedosa y la más fácil de arruinar. El control no muestra su valor: verlo ancla la respuesta y convierte una medición en una estimación. La pregunta se formula como tarea verificable, no como preferencia. El progreso se cuenta sobre la submuestra, no sobre la biblioteca.<\u002Fp>\n\n    <div style=\"background: #ffffff; border: 1px solid #e2e8f0;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9;\">\n        <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Tarea de umbrales<\u002Fspan>\n        <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;ThresholdTask&gt; · #threshold-task<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 24px; background: #f8fafc; border-bottom: 1px solid #f1f5f9; flex-wrap: wrap;\">\n        <div style=\"display: flex; align-items: center; gap: 20px;\">\n          <span style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">eje<\u002Fspan>\n          <div style=\"display: flex; gap: 2px;\">\n            <span style=\"padding: 5px 12px; background: #f97316; color: #ffffff; font-size: 11px; font-weight: 500;\">B1 desenfoque<\u002Fspan>\n            <span style=\"padding: 5px 12px; background: #ffffff; border: 1px solid #e2e8f0; color: #94a3b8; font-size: 11px;\">B2 tamaño<\u002Fspan>\n            <span style=\"padding: 5px 12px; background: #ffffff; border: 1px solid #e2e8f0; color: #94a3b8; font-size: 11px;\">B3 desplazamiento<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 20px;\">\n          <div style=\"display: flex; align-items: center; gap: 8px;\">\n            <span style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">pasada<\u002Fspan>\n            <span style=\"width: 10px; height: 10px; background: #f97316;\"><\u002Fspan>\n            <span style=\"width: 10px; height: 10px; background: #ffffff; border: 1px solid #cbd5e1;\"><\u002Fspan>\n            <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #334155;\">1 de 2 · nítido → degradado<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #64748b;\">ítem 3 de 10 · submuestra<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 32px 24px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start;\">\n        <div style=\"background: #e5e5e5; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; border: 1px solid #cbd5e1; height: 260px; display: flex; align-items: center; justify-content: center;\">\n          <div style=\"width: 148px; height: 148px; background: #ffffff; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; filter: blur(2.4px);\">pictograma<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n          <p style=\"margin: 0; font-size: 17px; font-weight: 300; line-height: 1.5; color: #0f172a; text-wrap: pretty;\">Mueva el control hasta el punto en que ya no pueda nombrar qué muestra el pictograma.<\u002Fp>\n          <div>\n            <input id=\"spec-b-slider\" type=\"range\" min=\"0\" max=\"100\" value=\"{{ sliderValue }}\" sc-camel-on-input=\"{{ onSlider }}\" aria-label=\"Nivel de degradación\" style=\"width: 100%; accent-color: #f97316; height: 24px;\">\n            <div style=\"display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">\n              <span>nítido<\u002Fspan><span>ilegible<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top: 10px; padding: 8px 12px; background: #f1f5f9; font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">valor oculto por diseño · ← → ajustan en pasos discretos<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: center;\">\n            <button type=\"button\" style=\"display: inline-flex; align-items: center; justify-content: center; background: #40069e; color: #ffffff; padding: 10px 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; border: none; border-radius: 3px; cursor: pointer; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);\" style-hover=\"background: #000000;\">registrar punto<\u002Fbutton>\n            <button type=\"button\" style=\"display: inline-flex; align-items: center; justify-content: center; background: transparent; color: #475569; padding: 8px 16px; font-size: 12px; border: 1px solid #e2e8f0; border-radius: 3px; cursor: pointer;\" style-hover=\"border-color: #40069e; color: #40069e;\">no puedo hacer esta tarea<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 16px 24px; border-top: 1px solid #f1f5f9; background: #f8fafc; display: flex; gap: 32px; flex-wrap: wrap;\">\n        <span style=\"font-size: 11px; color: #64748b;\">Punto de partida aleatorizado por ítem<\u002Fspan>\n        <span style=\"font-size: 11px; color: #64748b;\">Orden de ítems aleatorizado<\u002Fspan>\n        <span style=\"font-size: 11px; color: #64748b;\">El valor de la pasada anterior no se muestra<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 24px; background: #ffffff; border: 1px solid #e2e8f0; padding: 24px;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px;\">\n        <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Lectura del dato B · unidades físicas y fiabilidad<\u002Fspan>\n        <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;LayerBReadout&gt;<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #f1f5f9; border: 1px solid #e2e8f0;\">\n        <div style=\"background: #ffffff; padding: 18px;\">\n          <div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #94a3b8; margin-bottom: 8px;\">B1 · desenfoque<\u002Fdiv>\n          <div style=\"font-size: 26px; font-weight: 200; color: #0f172a; line-height: 1;\">3.8<span style=\"font-size: 12px; color: #64748b; font-weight: 400;\"> σ px<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 11px; color: #64748b;\">pasadas 3.6 · 4.0 &nbsp;<span style=\"color: #047857;\">Δ 0.4<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px;\">\n          <div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #94a3b8; margin-bottom: 8px;\">B2 · tamaño<\u002Fdiv>\n          <div style=\"font-size: 26px; font-weight: 200; color: #0f172a; line-height: 1;\">96<span style=\"font-size: 12px; color: #64748b; font-weight: 400;\"> px diag<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 11px; color: #64748b;\">pasadas 78 · 114 &nbsp;<span style=\"color: #a16207;\">Δ 36<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px;\">\n          <div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #94a3b8; margin-bottom: 8px;\">B3 · desplazamiento<\u002Fdiv>\n          <div style=\"font-size: 26px; font-weight: 200; color: #0f172a; line-height: 1;\">12<span style=\"font-size: 12px; color: #64748b; font-weight: 400;\"> px barrido<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 11px; color: #64748b;\">pasadas 11 · 13 &nbsp;<span style=\"color: #047857;\">Δ 2<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 14px 0 0; font-size: 12px; color: #64748b; line-height: 1.55; max-width: 84ch; text-wrap: pretty;\">La diferencia entre pasadas es el indicador de fiabilidad del dato, no un motivo de descarte: se muestra siempre y nunca se convierte en un aviso de error. B2 declara además su límite conocido — la comparación es válida dentro de una misma sesión mientras no exista calibración física.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 06 CAPA C ══════════ -->\n  <section id=\"s6\" style=\"margin-bottom: 88px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n      <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #94a3b8;\">06<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a;\">Capa C · escala y ausencias coequivalentes<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 12px; max-width: 78ch; font-size: 13px; line-height: 1.65; color: #475569; text-wrap: pretty;\">La regla más fácil de violar sin darse cuenta. Los tres estados de ausencia tienen el mismo peso gráfico que la escala: misma altura, mismo peso de borde, misma fila. Si «no tengo competencia» parece una salida de emergencia, la gente pondrá 3 y el instrumento pierde exactamente la información que este diseño vino a preservar.<\u002Fp>\n    <sc-if value=\"{{ showRationale }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"margin: 0 0 28px; max-width: 78ch; font-size: 12px; line-height: 1.6; color: #64748b; padding: 10px 14px; background: #f1f5f9; text-wrap: pretty;\"><strong style=\"font-weight: 500; color: #334155;\">Forma elegida:<\u002Fstrong> una sola fila de siete celdas de igual tamaño, separadas por un espacio mayor entre el bloque 1–5 y el bloque de ausencias. La separación distingue naturaleza, no jerarquía. Ninguna celda arranca seleccionada, y el estado inicial es visiblemente distinto de cualquier estado elegido.<\u002Fp>\n    <\u002Fsc-if>\n\n    <div style=\"background: #ffffff; border: 1px solid #e2e8f0;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9;\">\n        <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Entrada de juicio<\u002Fspan>\n        <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;JudgmentEntry&gt; · #judgment-dim-c1<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding: 24px; display: flex; flex-direction: column; gap: 28px;\">\n\n        <div>\n          <div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;\">\n            <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #10b981;\">C1<\u002Fspan>\n            <span style=\"font-size: 15px; font-weight: 500; color: #0f172a;\">Transparencia semántica<\u002Fspan>\n            <span style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">sin responder<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 0 0 16px; font-size: 13px; color: #475569; line-height: 1.55;\">¿Cuánto se adivina el significado sin haberlo aprendido antes?<\u002Fp>\n          <div style=\"display: flex; gap: 24px; flex-wrap: wrap;\">\n            <div style=\"display: flex; gap: 2px;\">\n              <button type=\"button\" style=\"width: 60px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; font-family: 'Lexend', sans-serif; color: #94a3b8;\" style-hover=\"border-color: #40069e; color: #40069e;\"><span style=\"font-size: 18px; font-weight: 300;\">1<\u002Fspan><\u002Fbutton>\n              <button type=\"button\" style=\"width: 60px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; font-family: 'Lexend', sans-serif; color: #94a3b8;\" style-hover=\"border-color: #40069e; color: #40069e;\"><span style=\"font-size: 18px; font-weight: 300;\">2<\u002Fspan><\u002Fbutton>\n              <button type=\"button\" style=\"width: 60px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; font-family: 'Lexend', sans-serif; color: #94a3b8;\" style-hover=\"border-color: #40069e; color: #40069e;\"><span style=\"font-size: 18px; font-weight: 300;\">3<\u002Fspan><\u002Fbutton>\n              <button type=\"button\" style=\"width: 60px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #ede9fe; border: 1px solid #40069e; border-radius: 4px; cursor: pointer; font-family: 'Lexend', sans-serif; color: #40069e;\"><span style=\"font-size: 18px; font-weight: 500;\">4<\u002Fspan><\u002Fbutton>\n              <button type=\"button\" style=\"width: 60px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; font-family: 'Lexend', sans-serif; color: #94a3b8;\" style-hover=\"border-color: #40069e; color: #40069e;\"><span style=\"font-size: 18px; font-weight: 300;\">5<\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 2px;\">\n              <button type=\"button\" style=\"width: 96px; height: 60px; display: flex; align-items: center; justify-content: center; padding: 0 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; font-family: 'Lexend', sans-serif; font-size: 11px; line-height: 1.3; color: #64748b; text-align: center;\" style-hover=\"border-color: #40069e; color: #40069e;\">no aplica<\u002Fbutton>\n              <button type=\"button\" style=\"width: 96px; height: 60px; display: flex; align-items: center; justify-content: center; padding: 0 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; font-family: 'Lexend', sans-serif; font-size: 11px; line-height: 1.3; color: #64748b; text-align: center;\" style-hover=\"border-color: #40069e; color: #40069e;\">no sé juzgar esto<\u002Fbutton>\n              <button type=\"button\" style=\"width: 96px; height: 60px; display: flex; align-items: center; justify-content: center; padding: 0 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; font-family: 'Lexend', sans-serif; font-size: 11px; line-height: 1.3; color: #64748b; text-align: center;\" style-hover=\"border-color: #40069e; color: #40069e;\">prefiero omitir<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; max-width: 306px; margin-top: 8px; font-size: 10px; color: #94a3b8;\">\n            <span>nada transparente<\u002Fspan><span>del todo<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border-top: 1px solid #f1f5f9; padding-top: 24px;\">\n          <div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px;\">\n            <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #10b981;\">C3<\u002Fspan>\n            <span style=\"font-size: 15px; font-weight: 500; color: #0f172a;\">Adecuación cultural<\u002Fspan>\n            <span style=\"display: inline-block; padding: 2px 8px; background: #f1f5f9; border: 1px solid #cbd5e1; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #475569;\">sin competencia<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background: #f8fafc; border: 1px solid #e2e8f0; padding: 18px;\">\n            <label for=\"spec-c3-reason\" style=\"display: block; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 8px;\">motivo · obligatorio<\u002Flabel>\n            <textarea id=\"spec-c3-reason\" rows=\"2\" placeholder=\"No conozco el contexto cultural de referencia de esta biblioteca.\" style=\"width: 100%; padding: 12px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 4px; font-family: 'Lexend', sans-serif; font-size: 13px; color: #0f172a; resize: vertical;\"><\u002Ftextarea>\n            <p style=\"margin: 10px 0 0; font-size: 11px; color: #64748b;\">Declarar falta de competencia abre motivo obligatorio. «No aplica» y «prefiero omitir» lo tienen opcional.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 320px 1fr; gap: 24px; margin-top: 24px;\">\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; padding: 24px;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px;\">\n          <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Triángulo C<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;LayerCTriangle&gt;<\u002Fspan>\n        <\u002Fdiv>\n        <svg sc-camel-view-box=\"0 0 240 216\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"Triángulo de capa C: transparencia 4, pragmática 3, cultural 4 sobre 5\">\n          <polygon points=\"120,20 205,170 35,170\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"1\"><\u002Fpolygon>\n          <polygon points=\"120,70 162,145 78,145\" fill=\"none\" stroke=\"#f1f5f9\" stroke-width=\"1\"><\u002Fpolygon>\n          <line x1=\"120\" y1=\"95\" x2=\"120\" y2=\"20\" stroke=\"#e2e8f0\" stroke-width=\"1\"><\u002Fline>\n          <line x1=\"120\" y1=\"95\" x2=\"205\" y2=\"170\" stroke=\"#e2e8f0\" stroke-width=\"1\"><\u002Fline>\n          <line x1=\"120\" y1=\"95\" x2=\"35\" y2=\"170\" stroke=\"#e2e8f0\" stroke-width=\"1\"><\u002Fline>\n          <polygon points=\"120,35 188,158 61,158\" fill=\"#10b981\" fill-opacity=\"0.14\" stroke=\"#10b981\" stroke-width=\"1.5\"><\u002Fpolygon>\n          <circle cx=\"120\" cy=\"35\" r=\"3\" fill=\"#10b981\"><\u002Fcircle>\n          <circle cx=\"188\" cy=\"158\" r=\"3\" fill=\"#10b981\"><\u002Fcircle>\n          <circle cx=\"61\" cy=\"158\" r=\"3\" fill=\"#10b981\"><\u002Fcircle>\n          <text x=\"120\" y=\"12\" text-anchor=\"middle\" font-family=\"Fira Code, monospace\" font-size=\"10\" fill=\"#64748b\">C1 · 4<\u002Ftext>\n          <text x=\"214\" y=\"184\" text-anchor=\"end\" font-family=\"Fira Code, monospace\" font-size=\"10\" fill=\"#64748b\">C2 · 3<\u002Ftext>\n          <text x=\"26\" y=\"184\" text-anchor=\"start\" font-family=\"Fira Code, monospace\" font-size=\"10\" fill=\"#64748b\">C3 · 4<\u002Ftext>\n        <\u002Fsvg>\n        <p style=\"margin: 12px 0 0; font-size: 11px; color: #64748b; line-height: 1.55;\">El único radar legítimo del instrumento: tres ejes conmensurables, misma escala, misma unidad.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fefce8; border: 1px solid #fde68a; padding: 24px;\">\n        <div style=\"display: inline-block; padding: 2px 8px; background: #fef9c3; border: 1px solid #fde68a; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #a16207; margin-bottom: 12px;\">decisión pendiente · para el diseñador<\u002Fdiv>\n        <p style=\"margin: 0 0 12px; font-size: 13px; line-height: 1.6; color: #713f12; text-wrap: pretty;\">El requisito dice «triángulo para la capa C, tres ejes conmensurables», pero la capa C tiene cuatro dimensiones Likert. C4 aprendibilidad entró con la primera revisión externa, después de fijar la figura.<\u002Fp>\n        <p style=\"margin: 0 0 12px; font-size: 13px; line-height: 1.6; color: #713f12; text-wrap: pretty;\">Aquí se resuelve como triángulo C1–C3 más C4 reportada al lado en la misma unidad, porque un cuadrilátero con un eje incorporado más tarde invita a leer área donde no hay área que leer. Es una decisión de forma, no de instrumento: confírmala o corrígela.<\u002Fp>\n        <div style=\"display: flex; align-items: center; gap: 14px; background: #ffffff; border: 1px solid #fde68a; padding: 14px 18px; margin-top: 16px;\">\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #10b981;\">C4<\u002Fspan>\n          <span style=\"font-size: 13px; color: #0f172a;\">Aprendibilidad<\u002Fspan>\n          <span style=\"margin-left: auto; font-size: 22px; font-weight: 200; color: #0f172a;\">4 <span style=\"font-size: 12px; color: #64748b; font-weight: 400;\">/ 5<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 07 REVELACIÓN DIFERIDA ══════════ -->\n  <section id=\"s7\" style=\"margin-bottom: 88px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n      <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #94a3b8;\">07<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a;\">Revelación diferida con sellado<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 12px; max-width: 78ch; font-size: 13px; line-height: 1.65; color: #475569; text-wrap: pretty;\">El patrón central del instrumento, y aparece dos veces: en la comprensión espontánea y en la calibración. Necesita un tratamiento gráfico propio y reconocible, para que la segunda vez la persona ya sepa qué va a pasar. La marca es la <strong style=\"font-weight: 500;\">regla violeta de 2&nbsp;px sobre el bloque diferido<\u002Fstrong> más la etiqueta en violeta. Aparece sólo aquí.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;\">\n\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; display: flex; flex-direction: column;\">\n        <div style=\"padding: 14px 20px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: baseline; justify-content: space-between;\">\n          <span style=\"font-size: 12px; font-weight: 500; color: #0f172a;\">1 · respondiendo<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">state=answering<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"background: #e5e5e5; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; border: 1px solid #cbd5e1; height: 96px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">pictograma<\u002Fdiv>\n          <div style=\"border-top: 2px solid #40069e; background: #f8fafc; padding: 14px;\">\n            <div style=\"font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #40069e; margin-bottom: 8px;\">revelación diferida<\u002Fdiv>\n            <p style=\"margin: 0; font-size: 12px; line-height: 1.5; color: #475569;\">La frase objetivo no está en esta vista. La vista pide del servidor sólo los campos que puede mostrar.<\u002Fp>\n          <\u002Fdiv>\n          <label for=\"spec-ce-input\" style=\"font-size: 12px; color: #0f172a;\">¿Qué muestra este pictograma?<\u002Flabel>\n          <input id=\"spec-ce-input\" type=\"text\" placeholder=\"Escriba su respuesta\" style=\"width: 100%; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; font-family: 'Lexend', sans-serif; font-size: 13px;\">\n          <div style=\"margin-top: auto; display: flex; flex-direction: column; gap: 10px;\">\n            <p style=\"margin: 0; font-size: 11px; line-height: 1.5; color: #a16207; background: #fefce8; border: 1px solid #fde68a; padding: 10px 12px;\">Al sellar se revela la frase objetivo y su respuesta queda fija. No podrá editarla después.<\u002Fp>\n            <button type=\"button\" style=\"display: inline-flex; align-items: center; justify-content: center; background: #40069e; color: #ffffff; padding: 11px 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; border: none; border-radius: 3px; cursor: pointer; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);\" style-hover=\"background: #000000;\">sellar respuesta<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; display: flex; flex-direction: column;\">\n        <div style=\"padding: 14px 20px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: baseline; justify-content: space-between;\">\n          <span style=\"font-size: 12px; font-weight: 500; color: #0f172a;\">2 · confirmación<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">state=confirming<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; background: #f8fafc;\">\n          <div style=\"background: #ffffff; border: 1px solid #cbd5e1; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25); padding: 22px; display: flex; flex-direction: column; gap: 16px;\">\n            <div style=\"border-top: 2px solid #40069e; margin: -22px -22px 0; padding: 14px 22px 0;\">\n              <span style=\"font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #40069e;\">paso irreversible<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin: 0; font-size: 14px; font-weight: 300; line-height: 1.5; color: #0f172a; text-wrap: pretty;\">Va a sellar «<span style=\"font-weight: 500;\">Niño tomando agua<\u002Fspan>». Al confirmar aparecerá la frase objetivo y su respuesta quedará registrada tal como está.<\u002Fp>\n            <div style=\"display: flex; gap: 10px;\">\n              <button type=\"button\" style=\"flex: 1; display: inline-flex; align-items: center; justify-content: center; background: #40069e; color: #ffffff; padding: 11px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; border: none; border-radius: 3px; cursor: pointer;\" style-hover=\"background: #000000;\">sellar y revelar<\u002Fbutton>\n              <button type=\"button\" style=\"display: inline-flex; align-items: center; justify-content: center; background: transparent; color: #475569; padding: 9px 16px; font-size: 12px; border: 1px solid #e2e8f0; border-radius: 3px; cursor: pointer;\" style-hover=\"border-color: #40069e; color: #40069e;\">seguir editando<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 11px; color: #64748b; line-height: 1.5;\">El sellado exige acción deliberada. Nunca ocurre por navegación ni por tiempo, y el aviso nombra qué se revela — no es un «¿está seguro?».<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0; display: flex; flex-direction: column;\">\n        <div style=\"padding: 14px 20px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: baseline; justify-content: space-between;\">\n          <span style=\"font-size: 12px; font-weight: 500; color: #0f172a;\">3 · revelado<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">state=revealed<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"background: #e5e5e5; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; border: 1px solid #cbd5e1; height: 96px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">pictograma<\u002Fdiv>\n          <div style=\"border-top: 2px solid #40069e;\">\n            <div style=\"padding: 14px 0 0;\">\n              <span style=\"font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #40069e;\">revelado · sellado<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 2px; background: #e2e8f0; border: 1px solid #e2e8f0;\">\n            <div style=\"background: #ffffff; padding: 14px;\">\n              <div style=\"font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 6px;\">usted respondió<\u002Fdiv>\n              <div style=\"font-size: 14px; font-weight: 300; text-transform: none; letter-spacing: 0.01ex; color: #0f172a;\">Niño tomando agua<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #ffffff; padding: 14px;\">\n              <div style=\"font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 6px;\">frase objetivo<\u002Fdiv>\n              <div style=\"font-size: 14px; font-weight: 300; text-transform: none; letter-spacing: 0.01ex; color: #40069e;\">Quiero agua, por favor<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: auto; display: flex; flex-direction: column; gap: 10px;\">\n            <div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b; background: #f1f5f9; padding: 10px 12px;\">sellado 14:22 · registro inmutable · el control de edición se retiró del DOM<\u002Fdiv>\n            <button type=\"button\" style=\"display: inline-flex; align-items: center; justify-content: center; background: #40069e; color: #ffffff; padding: 11px 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; border: none; border-radius: 3px; cursor: pointer;\" style-hover=\"background: #000000;\">continuar a correspondencia<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 16px; padding: 14px 18px; background: #ffffff; border: 1px solid #e2e8f0;\">\n      <span style=\"font-size: 12px; color: #475569; line-height: 1.6;\"><strong style=\"font-weight: 500; color: #0f172a;\">Se retira, no se deshabilita.<\u002Fstrong> Un control deshabilitado invita a buscar cómo habilitarlo. Tras sellar, el control desaparece de la vista y su lugar lo toma la línea de registro en monoespaciado.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 08 FAMILIA ══════════ -->\n  <section id=\"s8\" style=\"margin-bottom: 88px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n      <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #94a3b8;\">08<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a;\">Familia · el plano de portada<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 28px; max-width: 78ch; font-size: 13px; line-height: 1.65; color: #475569; text-wrap: pretty;\">Confusabilidad contra consistencia. Reemplaza la función retórica que cumplía el hexágono de v1: legible de un vistazo, dos ejes comparables entre sí, y muestra la única propiedad que ningún otro instrumento del campo mide. Es la figura que se cita, así que aguanta captura de pantalla sin leyenda externa.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px;\">\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9;\">\n          <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Plano de familia<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;FamilyPlane&gt; · #family-plane<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 24px;\">\n          <svg sc-camel-view-box=\"0 0 420 300\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"Plano de confusabilidad contra consistencia con 14 ítems de la familia\">\n            <rect x=\"52\" y=\"16\" width=\"344\" height=\"236\" fill=\"#ffffff\" stroke=\"#e2e8f0\"><\u002Frect>\n            <line x1=\"52\" y1=\"75\" x2=\"396\" y2=\"75\" stroke=\"#f1f5f9\"><\u002Fline>\n            <line x1=\"52\" y1=\"134\" x2=\"396\" y2=\"134\" stroke=\"#f1f5f9\"><\u002Fline>\n            <line x1=\"52\" y1=\"193\" x2=\"396\" y2=\"193\" stroke=\"#f1f5f9\"><\u002Fline>\n            <line x1=\"138\" y1=\"16\" x2=\"138\" y2=\"252\" stroke=\"#f1f5f9\"><\u002Fline>\n            <line x1=\"224\" y1=\"16\" x2=\"224\" y2=\"252\" stroke=\"#f1f5f9\"><\u002Fline>\n            <line x1=\"310\" y1=\"16\" x2=\"310\" y2=\"252\" stroke=\"#f1f5f9\"><\u002Fline>\n            <rect x=\"310\" y=\"16\" width=\"86\" height=\"236\" fill=\"#fee2e2\" fill-opacity=\"0.5\"><\u002Frect>\n            <line x1=\"310\" y1=\"16\" x2=\"310\" y2=\"252\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\u002Fline>\n            <text x=\"314\" y=\"30\" font-family=\"Fira Code, monospace\" font-size=\"9\" fill=\"#991b1b\">veto D1 · 0.78<\u002Ftext>\n            <circle cx=\"96\" cy=\"212\" r=\"4.5\" fill=\"#8b5cf6\" fill-opacity=\"0.75\"><\u002Fcircle>\n            <circle cx=\"128\" cy=\"188\" r=\"4.5\" fill=\"#8b5cf6\" fill " transform=\"rotate(-90 18 134)\">D2 · CV DE CONSISTENCIA<\u002Ftext>\n            <text x=\"52\" y=\"268\" text-anchor=\"middle\" font-family=\"Fira Code, monospace\" font-size=\"9\" fill=\"#94a3b8\">0.0<\u002Ftext>\n            <text x=\"396\" y=\"268\" text-anchor=\"middle\" font-family=\"Fira Code, monospace\" font-size=\"9\" fill=\"#94a3b8\">1.0<\u002Ftext>\n            <text x=\"42\" y=\"252\" text-anchor=\"end\" font-family=\"Fira Code, monospace\" font-size=\"9\" fill=\"#94a3b8\">0%<\u002Ftext>\n            <text x=\"42\" y=\"22\" text-anchor=\"end\" font-family=\"Fira Code, monospace\" font-size=\"9\" fill=\"#94a3b8\">40%<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9;\">\n          <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Distribución de pares<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;PairDistribution&gt;<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 24px;\">\n          <p style=\"margin: 0 0 16px; font-size: 12px; color: #475569; line-height: 1.55;\">La distribución completa, no sólo la cola. El corte se deriva de la distribución y se muestra sobre ella.<\u002Fp>\n          <svg sc-camel-view-box=\"0 0 300 150\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"Histograma de la distribución de correlación por par, con el corte en 0.78\">\n            <rect x=\"12\" y=\"120\" width=\"20\" height=\"14\" fill=\"#c4b5fd\"><\u002Frect>\n            <rect x=\"34\" y=\"96\" width=\"20\" height=\"38\" fill=\"#c4b5fd\"><\u002Frect>\n            <rect x=\"56\" y=\"62\" width=\"20\" height=\"72\" fill=\"#a78bfa\"><\u002Frect>\n            <rect x=\"78\" y=\"36\" width=\"20\" height=\"98\" fill=\"#a78bfa\"><\u002Frect>\n            <rect x=\"100\" y=\"22\" width=\"20\" height=\"112\" fill=\"#8b5cf6\"><\u002Frect>\n            <rect x=\"122\" y=\"44\" width=\"20\" height=\"90\" fill=\"#8b5cf6\"><\u002Frect>\n            <rect x=\"144\" y=\"70\" width=\"20\" height=\"64\" fill=\"#a78bfa\"><\u002Frect>\n            <rect x=\"166\" y=\"92\" width=\"20\" height=\"42\" fill=\"#a78bfa\"><\u002Frect>\n            <rect x=\"188\" y=\"108\" width=\"20\" height=\"26\" fill=\"#c4b5fd\"><\u002Frect>\n            <rect x=\"210\" y=\"118\" width=\"20\" height=\"16\" fill=\"#c4b5fd\"><\u002Frect>\n            <rect x=\"232\" y=\"124\" width=\"20\" height=\"10\" fill=\"#fca5a5\"><\u002Frect>\n            <rect x=\"254\" y=\"128\" width=\"20\" height=\"6\" fill=\"#dc2626\"><\u002Frect>\n            <rect x=\"276\" y=\"130\" width=\"16\" height=\"4\" fill=\"#dc2626\"><\u002Frect>\n            <line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"140\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\u002Fline>\n            <text x=\"226\" y=\"10\" text-anchor=\"end\" font-family=\"Fira Code, monospace\" font-size=\"9\" fill=\"#991b1b\">corte 0.78<\u002Ftext>\n            <line x1=\"12\" y1=\"134\" x2=\"292\" y2=\"134\" stroke=\"#0f172a\"><\u002Fline>\n            <text x=\"12\" y=\"148\" font-family=\"Fira Code, monospace\" font-size=\"9\" fill=\"#94a3b8\">0.0<\u002Ftext>\n            <text x=\"292\" y=\"148\" text-anchor=\"end\" font-family=\"Fira Code, monospace\" font-size=\"9\" fill=\"#94a3b8\">1.0<\u002Ftext>\n          <\u002Fsvg>\n          <div style=\"margin-top: 20px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #f1f5f9; padding-top: 16px;\">\n            <div style=\"display: flex; justify-content: space-between; font-size: 12px;\"><span style=\"color: #64748b;\">pares evaluados<\u002Fspan><span style=\"font-family: 'Fira Code', monospace; color: #0f172a;\">91<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; font-size: 12px;\"><span style=\"color: #64748b;\">sobre el corte<\u002Fspan><span style=\"font-family: 'Fira Code', monospace; color: #991b1b;\">3<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; font-size: 12px;\"><span style=\"color: #64748b;\">D3 · fragilidad<\u002Fspan><span style=\"font-family: 'Fira Code', monospace; color: #0f172a;\">ordenamiento, sin criterio<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 24px; background: #ffffff; border: 1px solid #e2e8f0; padding: 24px;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px;\">\n        <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Agregado de la fuente · nunca un número<\u002Fspan>\n        <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;AggregateView&gt; · #aggregate-coverage<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #f1f5f9; border: 1px solid #e2e8f0;\">\n        <div style=\"background: #ffffff; padding: 18px;\">\n          <div style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 8px;\">cobertura<\u002Fdiv>\n          <div style=\"font-size: 22px; font-weight: 200; color: #0f172a;\">62<span style=\"font-size: 11px; color: #64748b; font-weight: 400;\"> % de 214<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px;\">\n          <div style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 8px;\">personas<\u002Fdiv>\n          <div style=\"font-size: 22px; font-weight: 200; color: #0f172a;\">9<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px;\">\n          <div style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 8px;\">protocolo<\u002Fdiv>\n          <div style=\"font-family: 'Fira Code', monospace; font-size: 12px; color: #0f172a; line-height: 1.5;\">prot 2.1<br>rúbr 2.0<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px;\">\n          <div style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 8px;\">desacuerdo<\u002Fdiv>\n          <div style=\"font-size: 22px; font-weight: 200; color: #0f172a;\">0.41<span style=\"font-size: 11px; color: #64748b; font-weight: 400;\"> α<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px;\">\n          <div style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 8px;\">contextos<\u002Fdiv>\n          <div style=\"font-size: 12px; color: #0f172a; line-height: 1.5;\">tablero impreso · pantalla 10\"<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 14px 0 0; font-size: 12px; color: #64748b; line-height: 1.55;\">Las cinco celdas van siempre juntas y ninguna puede faltar. Estadísticas y registros individuales viven en secciones separadas: la evidencia no se mezcla.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 09 ESTADOS DEL DATO ══════════ -->\n  <section id=\"s9\" style=\"margin-bottom: 88px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n      <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #94a3b8;\">09<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a;\">Estados del dato<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 28px; max-width: 78ch; font-size: 13px; line-height: 1.65; color: #475569; text-wrap: pretty;\">El estado parcial es la situación normal de v2, no un error, y es el peor atendido en cualquier interfaz. Estos son los distintivos que lo hacen legible. La distinción entre <em>pendiente<\u002Fem> y <em>no muestreado<\u002Fem> es obligatoria: la segunda no tiene tarea asociada y nunca la tendrá.<\u002Fp>\n\n    <div style=\"background: #ffffff; border: 1px solid #e2e8f0;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9;\">\n        <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Distintivos de estado<\u002Fspan>\n        <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;StateChip&gt;<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding: 24px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background: #f1f5f9;\">\n        <div style=\"background: #ffffff; padding: 18px; display: flex; align-items: flex-start; gap: 16px;\">\n          <span style=\"flex-shrink: 0; display: inline-block; padding: 3px 10px; background: #f8fafc; border: 1px solid #e2e8f0; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">pendiente<\u002Fspan>\n          <span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Hay tarea y está sin hacer. Es accionable: enlaza a la tarea.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px; display: flex; align-items: flex-start; gap: 16px;\">\n          <span style=\"flex-shrink: 0; display: inline-block; padding: 3px 10px; background: #ffffff; border: 1px dashed #cbd5e1; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">no muestreado<\u002Fspan>\n          <span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Fuera de la submuestra de capa B. No hay tarea y no la habrá. Borde discontinuo, nunca accionable.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px; display: flex; align-items: flex-start; gap: 16px;\">\n          <span style=\"flex-shrink: 0; display: inline-block; padding: 3px 10px; background: #d1fae5; border: 1px solid #a7f3d0; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #047857;\">registrada<\u002Fspan>\n          <span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Sellada e inmutable, anclada a una versión exacta del ítem.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px; display: flex; align-items: flex-start; gap: 16px;\">\n          <span style=\"flex-shrink: 0; display: inline-block; padding: 3px 10px; background: #f1f5f9; border: 1px solid #cbd5e1; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b;\">superada<\u002Fspan>\n          <span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Referida a una versión anterior. Se muestra siempre, separada y etiquetada. Ocultarla pierde la trazabilidad.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px; display: flex; align-items: flex-start; gap: 16px;\">\n          <span style=\"flex-shrink: 0; display: inline-block; padding: 3px 10px; background: #ffedd5; border: 1px solid #fed7aa; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #9a3412;\">calculando<\u002Fspan>\n          <span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Sólo para ingesta y capa D. Dice <em>qué<\u002Fem> se está calculando, no cuánto falta.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px; display: flex; align-items: flex-start; gap: 16px;\">\n          <span style=\"flex-shrink: 0; display: inline-block; padding: 3px 10px; background: #fee2e2; border: 1px solid #fecaca; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #991b1b;\">excluida<\u002Fspan>\n          <span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Fila que la ingesta no admitió, con su motivo nombrado. Sin reparación automática.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px;\">\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9;\">\n          <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Herencia visible<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;InheritedValue&gt;<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px;\">\n            <span style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">licencia<\u002Fspan>\n            <span style=\"display: flex; align-items: baseline; gap: 8px;\"><span style=\"font-size: 13px; color: #0f172a;\">CC BY 4.0<\u002Fspan><span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #94a3b8;\">heredado<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height: 1px; background: #f1f5f9;\"><\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px;\">\n            <span style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">autoría<\u002Fspan>\n            <span style=\"display: flex; align-items: baseline; gap: 8px;\"><span style=\"font-size: 13px; color: #0f172a;\">M. Riquelme<\u002Fspan><span style=\"font-family: 'Fira Code', monospace; font-size: 9px; color: #7c3aed;\">excepción del ítem<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 4px 0 0; font-size: 11px; color: #64748b; line-height: 1.55;\">Siempre el valor efectivo, con el origen indicado de forma discreta. La exportación ofrece explícitamente vista compacta o resuelta.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #ffffff; border: 1px solid #e2e8f0;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9;\">\n          <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Versión anclada<\u002Fspan>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;VersionAnchor&gt; · #item-version<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; display: flex; flex-direction: column; gap: 14px;\">\n          <div style=\"background: #f8fafc; border: 1px solid #e2e8f0; padding: 14px; font-family: 'Fira Code', monospace; font-size: 11px; color: #334155; line-height: 1.7;\">\n            item AR_0413 · v3 · sha 8f2ad1c<br><span style=\"color: #64748b;\">lo que ve se computó sobre esta versión<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid #f1f5f9; padding-top: 14px;\">\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 10px;\">\n              <span style=\"font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\">evidencia superada<\u002Fspan>\n              <span style=\"display: inline-block; padding: 2px 8px; background: #f1f5f9; border: 1px solid #cbd5e1; font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b;\">2 registros<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b; line-height: 1.8;\">v2 · sha 41b0e9d · 6 registros C<br>v1 · sha 0ac7712 · 3 registros C<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 10 ARMAZÓN ══════════ -->\n  <section id=\"s10\" style=\"margin-bottom: 88px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n      <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #94a3b8;\">10<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a;\">Armazón de dos niveles y pie<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 28px; max-width: 78ch; font-size: 13px; line-height: 1.65; color: #475569; text-wrap: pretty;\">Arriba, el indicador de preparación: avanza y no retrocede, y mientras la sesión no esté calibrada no hay acceso a la tarea. Al costado, entrada permanente al diagnóstico, habilitada desde que la fuente queda analizada — antes de que nadie entregue un dato. Esa asimetría es la que invierte la economía de v1.<\u002Fp>\n\n    <div style=\"background: #ffffff; border: 1px solid #e2e8f0; margin-bottom: 24px;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 80px; padding: 0 24px; border-bottom: 1px solid #e2e8f0;\">\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <div style=\"display: flex; flex-direction: column;\">\n            <span style=\"font-weight: 800; font-size: 20px; letter-spacing: -0.02em; text-transform: uppercase; color: #0f172a; line-height: 1;\">ICAP<\u002Fspan>\n            <span style=\"font-size: 10px; font-weight: 400; letter-spacing: 0.05em; text-transform: uppercase; color: #64748b; margin-top: 5px;\">protocolo de accesibilidad<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 6px;\">\n          <span style=\"display: flex; align-items: center; gap: 7px; padding: 5px 12px; background: #ffffff; border: 1px solid #e2e8f0; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #047857;\"><span style=\"width: 6px; height: 6px; background: #10b981;\"><\u002Fspan>fuente<\u002Fspan>\n          <span style=\"width: 12px; height: 1px; background: #cbd5e1;\"><\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 7px; padding: 5px 12px; background: #ffffff; border: 1px solid #e2e8f0; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #047857;\"><span style=\"width: 6px; height: 6px; background: #10b981;\"><\u002Fspan>validación<\u002Fspan>\n          <span style=\"width: 12px; height: 1px; background: #cbd5e1;\"><\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 7px; padding: 5px 12px; background: #ffffff; border: 1px solid #e2e8f0; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #047857;\"><span style=\"width: 6px; height: 6px; background: #10b981;\"><\u002Fspan>perfil<\u002Fspan>\n          <span style=\"width: 12px; height: 1px; background: #cbd5e1;\"><\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 7px; padding: 5px 12px; background: #ede9fe; border: 1px solid #40069e; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #40069e;\"><span style=\"width: 6px; height: 6px; background: #40069e;\"><\u002Fspan>contexto<\u002Fspan>\n          <span style=\"width: 12px; height: 1px; background: #e2e8f0;\"><\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 7px; padding: 5px 12px; background: #f8fafc; border: 1px solid #e2e8f0; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8;\"><span style=\"width: 6px; height: 6px; background: #cbd5e1;\"><\u002Fspan>calibración<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <a href=\"#s8\" style=\"font-size: 12px; color: #7c3aed;\">Diagnóstico<\u002Fa>\n          <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #94a3b8;\">es-419<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 14px 24px; background: #f8fafc; display: flex; gap: 28px; flex-wrap: wrap;\">\n        <span style=\"font-size: 11px; color: #64748b;\">La tarea está bloqueada hasta completar calibración<\u002Fspan>\n        <span style=\"font-size: 11px; color: #64748b;\">El diagnóstico ya está disponible: la capa D se calculó en la ingesta<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #ffffff; border: 1px solid #e2e8f0;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9;\">\n        <span style=\"font-size: 13px; font-weight: 500; color: #0f172a;\">Pie · en todas las pantallas, discreto en las de tarea<\u002Fspan>\n        <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b;\">&lt;SiteFooter&gt; · #site-footer<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding: 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; flex-wrap: wrap;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px; max-width: 46ch;\">\n          <span style=\"font-size: 12px; color: #475569; line-height: 1.6;\">ICAP es una iniciativa de la red <a href=\"https://github.com/mediafranca\">MediaFranca<\u002Fa>. PICTOS.net publica bibliotecas; ICAP produce registros de evidencia sobre versiones exactas de sus pictogramas.<\u002Fspan>\n          <span style=\"font-size: 11px; color: #64748b;\">Herbert Spencer · investigación doctoral · <a href=\"https://github.com/mediafranca/ICAP\">mediafranca/ICAP<\u002Fa> · <a href=\"#s1\">Metodología<\u002Fa> · Apache 2.0<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 24px; font-family: 'Fira Code', monospace; font-size: 10px; color: #64748b; line-height: 1.8;\">\n          <div><div style=\"color: #94a3b8;\">esquema<\u002Fdiv>2.0<\u002Fdiv>\n          <div><div style=\"color: #94a3b8;\">rúbrica<\u002Fdiv>2.0<\u002Fdiv>\n          <div><div style=\"color: #94a3b8;\">protocolo<\u002Fdiv>2.1<\u002Fdiv>\n          <div><div style=\"color: #94a3b8;\">calibración<\u002Fdiv>2026-07-a<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 14px 24px; border-top: 1px solid #f1f5f9; background: #f8fafc;\">\n        <span style=\"font-size: 11px; color: #64748b; line-height: 1.55;\">Las cuatro versiones en el pie no son un detalle técnico trasladado por comodidad: quien saca una captura debería poder saber bajo qué protocolo se produjo lo que está viendo.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 11 PROHIBICIONES ══════════ -->\n  <sc-if value=\"{{ showAntipatterns }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"s11\" style=\"margin-bottom: 40px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n        <span style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #94a3b8;\">11<\u002Fspan>\n        <h2 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a;\">Prohibiciones<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin: 0 0 28px; max-width: 78ch; font-size: 13px; line-height: 1.65; color: #475569; text-wrap: pretty;\">Cada línea de aquí abajo rompe el instrumento, no la experiencia. Una propuesta que las viole no es una variante de ICAP: es otro instrumento, y uno que no mide lo que este mide.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: #e2e8f0; border: 1px solid #e2e8f0;\">\n        <div style=\"background: #ffffff; padding: 18px 20px;\"><div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #dc2626; margin-bottom: 6px;\">NoSingleAggregate<\u002Fdiv><span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Ningún puntaje único, ni promedio de capas, ni hexágono de seis ejes. Las unidades no son conmensurables.<\u002Fspan><\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px 20px;\"><div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #dc2626; margin-bottom: 6px;\">TargetPhraseHidden<\u002Fdiv><span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">La frase objetivo no llega al cliente en la vista de comprensión. Ocultarla con CSS deja la garantía decorativa.<\u002Fspan><\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px 20px;\"><div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #dc2626; margin-bottom: 6px;\">AnchorsHiddenWhileScoring<\u002Fdiv><span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Ancla y fundamento no se envían mientras se puntúa la calibración.<\u002Fspan><\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px 20px;\"><div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #dc2626; margin-bottom: 6px;\">NoForcedMidpoint<\u002Fdiv><span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Ninguna dimensión de capa C arranca con valor. Ningún estado de ausencia se ve secundario.<\u002Fspan><\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px 20px;\"><div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #dc2626; margin-bottom: 6px;\">HiddenSliderValue<\u002Fdiv><span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">El control de umbrales nunca muestra su valor numérico, ni el de la pasada anterior.<\u002Fspan><\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px 20px;\"><div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #dc2626; margin-bottom: 6px;\">NeverSilentlyCorrected<\u002Fdiv><span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Ninguna acción de reparación automática en la ingesta. Toda exclusión nombrada y descargable.<\u002Fspan><\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px 20px;\"><div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #dc2626; margin-bottom: 6px;\">Sin gradientes ni vidrio<\u002Fdiv><span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Nada de fondos degradados, tarjetas redondeadas con acento lateral, emoji, ni glassmorphism. No están en la fuente.<\u002Fspan><\u002Fdiv>\n        <div style=\"background: #ffffff; padding: 18px 20px;\"><div style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #dc2626; margin-bottom: 6px;\">Sin arrastre obligatorio<\u002Fdiv><span style=\"font-size: 12px; color: #475569; line-height: 1.55;\">Ninguna interacción depende sólo de arrastrar. Objetivo táctil mínimo 44&nbsp;px, foco visible, WCAG 2.1 AA completo.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <footer style=\"padding: 32px 0 0; border-top: 1px solid #cbd5e1; display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap;\">\n    <span style=\"font-size: 12px; color: #64748b;\">Los documentos de hand-off viven en <code style=\"font-family: 'Fira Code', monospace; font-size: 11px; color: #334155;\">handoff/<\u002Fcode>: convenciones de UI, mapa de IDs, tokens, garantías y cadena de copy en es-419.<\u002Fspan>\n    <span style=\"font-family: 'Fira Code', monospace; font-size: 10px; color: #94a3b8;\">ICAP v2 · lenguaje visual · hoja de especímenes<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showRationale&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hoja&quot;},&quot;showAntipatterns&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hoja&quot;},&quot;verdictSpecimen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bloqueado&quot;,&quot;admisible&quot;],&quot;default&quot;:&quot;bloqueado&quot;,&quot;tsType&quot;:&quot;'bloqueado' | 'admisible'&quot;,&quot;section&quot;:&quot;Especímenes&quot;}}\">\nclass Component extends DCLogic {\n  state = { slider: 42 };\n  renderVals() {\n    const verdict = this.props.verdictSpecimen ?? 'bloqueado';\n    return {\n      showRationale: this.props.showRationale ?? true,\n      showAntipatterns: this.props.showAntipatterns ?? true,\n      isBlocked: verdict === 'bloqueado',\n      isAdmissible: verdict === 'admisible',\n      sliderValue: this.state.slider,\n      onSlider: (e) => this.setState({ slider: Number(e.target.value) })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
